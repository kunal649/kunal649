<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="rule-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#C9A84C" stop-opacity="0.65"/>
      <stop offset="82%"  stop-color="#C9A84C" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F0ECE4"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Top gold rule -->
  <rect x="0" y="62" width="900" height="0.6" fill="url(#rule-gold)"/>
  <!-- Diamond on top rule -->
  <polygon points="450,57 454,62 450,67 446,62" fill="#C9A84C" opacity="0.7"/>

  <!-- KUNAL — large display serif, wide tracking -->
  <text
    x="450" y="168"
    font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
    font-size="100"
    font-weight="normal"
    fill="url(#name-fill)"
    text-anchor="middle"
    letter-spacing="20"
  >KUNAL</text>

  <!-- Vashisht — italic, warm gold -->
  <text
    x="450" y="214"
    font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
    font-size="38"
    font-style="italic"
    font-weight="normal"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="5"
  >Vashisht</text>

  <!-- Subtitle — small monospace, very muted -->
  <text
    x="450" y="248"
    font-family="'Courier New', Courier, monospace"
    font-size="10.5"
    fill="#3e3e52"
    text-anchor="middle"
    letter-spacing="5"
  >BACKEND ENGINEER  ·  SYSTEMS THINKER  ·  OSS CONTRIBUTOR</text>

  <!-- Bottom gold rule -->
  <rect x="0" y="268" width="900" height="0.6" fill="url(#rule-gold)"/>
  <!-- Diamond on bottom rule -->
  <polygon points="450,263 454,268 450,273 446,268" fill="#C9A84C" opacity="0.7"/>
</svg>
